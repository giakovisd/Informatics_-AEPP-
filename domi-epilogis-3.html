<style>
:root{--bg:#EEF3F7;--grid-line:rgba(43,58,103,0.07);--surface:#FFFFFF;--ink:#1B2438;--ink-soft:#5A6580;--indigo:#2B3A67;--indigo-deep:#182544;--indigo-soft:#DCE4F2;--coral:#E4572E;--coral-soft:#FBE0D6;--teal:#2E8B84;--teal-soft:#DCEFED;--amber:#F4B93D;--amber-soft:#FFF4D6;--code-bg:#111A2E;--code-ink:#DDE6F5;--code-kw:#7FB5FF;--code-kw2:#FFD166;--code-arrow:#FF8C69;--radius:16px;--shadow:0 6px 18px rgba(27,36,56,0.08)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:'Inter',sans-serif;color:var(--ink);background:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px),var(--bg);background-size:28px 28px,28px 28px,100% 100%;padding-bottom:80px}h1,h2,h3{font-family:'Baloo 2',sans-serif}header.hero{position:relative;padding:52px 24px 34px;text-align:center;overflow:hidden}.eyebrow{display:inline-flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:13px;letter-spacing:.06em;color:var(--indigo);background:var(--indigo-soft);padding:6px 14px;border-radius:999px;margin-bottom:18px}.eyebrow .dot{width:8px;height:8px;border-radius:50%;background:var(--teal)}h1.title{font-size:clamp(34px,6vw,56px);font-weight:800;color:var(--indigo-deep);margin:0 0 10px;letter-spacing:-0.01em}h1.title span{color:var(--teal)}.subtitle{max-width:680px;margin:0 auto 30px;color:var(--ink-soft);font-size:17px;line-height:1.6}.trail-wrap{max-width:720px;margin:0 auto 6px;display:flex;align-items:center;gap:10px}.trail-node{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--indigo);background:var(--surface);border:2px solid var(--indigo);border-radius:999px;padding:6px 14px;white-space:nowrap;box-shadow:var(--shadow)}.trail-track{flex:1;height:10px;background:var(--indigo-soft);border-radius:999px;position:relative;overflow:hidden}.trail-fill{position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,var(--amber),var(--teal));border-radius:999px;transition:width .5s cubic-bezier(.2,.9,.3,1)}.trail-caption{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:8px;font-family:'JetBrains Mono',monospace}.filters{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:820px;margin:28px auto 0}.chip{border:2px solid var(--indigo-soft);background:var(--surface);color:var(--indigo);font-weight:600;font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer;transition:.2s}.chip:hover{border-color:var(--indigo)}.chip.active{background:var(--indigo);color:#fff;border-color:var(--indigo)}main{max-width:980px;margin:0 auto;padding:10px 20px;display:flex;flex-direction:column;gap:26px}.ex-card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid rgba(43,58,103,0.06);padding:26px 26px 22px;transition:box-shadow .2s,transform .2s}.ex-card.done{border-left:5px solid var(--teal)}.ex-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}.ex-badge{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:#fff;background:var(--indigo);padding:4px 10px;border-radius:8px;letter-spacing:.03em}.ex-cat{font-size:12px;color:var(--coral);font-weight:700;text-transform:uppercase;letter-spacing:.04em}.ex-head h3{margin:0;font-size:20px;color:var(--indigo-deep);font-weight:700;flex-basis:100%;order:3}.ex-statement{color:var(--ink);font-size:15.5px;line-height:1.65;background:var(--amber-soft);border-left:4px solid var(--amber);padding:14px 16px;border-radius:10px;margin:12px 0 18px}.ex-actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px}.btn{font-family:'Inter',sans-serif;font-weight:700;font-size:14px;border:none;border-radius:10px;padding:10px 18px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:.15s}.btn:active{transform:scale(.97)}.btn-solution{background:var(--indigo-soft);color:var(--indigo-deep)}.btn-solution:hover,.btn-solution.open{background:var(--indigo);color:#fff}.btn-try{background:var(--teal-soft);color:var(--teal)}.btn-try:hover,.btn-try.open{background:var(--teal);color:#fff}.btn-run{background:var(--coral);color:#fff}.btn-run:hover{background:#c8451f}.btn-next{background:var(--amber);color:var(--indigo-deep);width:100%;justify-content:center;font-size:15px;margin-top:10px}.btn-next:hover{background:#e3a932}.collapse{max-height:0;overflow:hidden;transition:max-height .35s ease}.collapse.open{max-height:4000px}.collapse-inner{padding-top:14px}pre.code{background:var(--code-bg);color:var(--code-ink);font-family:'JetBrains Mono',monospace;font-size:13.5px;line-height:1.9;border-radius:12px;padding:18px 20px;margin:0;overflow-x:auto}.code-line{white-space:pre;padding:0 8px;border-left:3px solid transparent;transition:background .2s,border-color .2s;border-radius:4px}.code-line.active{background:rgba(46,139,132,0.35);border-left-color:var(--teal);color:#fff}.tk-kw{color:var(--code-kw);font-weight:700}.tk-cond{color:#FF8C69;font-weight:700}.tk-arrow{color:var(--code-arrow);font-weight:700}.try-panel{background:var(--bg);border:1px dashed var(--indigo-soft);border-radius:12px;padding:18px}.inputs-grid{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}.field{display:flex;flex-direction:column;gap:6px;min-width:130px}.field label{font-size:12.5px;font-weight:700;color:var(--indigo);font-family:'JetBrains Mono',monospace}.field input{border:2px solid var(--indigo-soft);border-radius:8px;padding:8px 10px;font-size:14px;font-family:'JetBrains Mono',monospace;width:130px;background:#fff}.field input[type="text"]{width:150px}.field input:focus{outline:none;border-color:var(--teal)}.field input.err{border-color:var(--coral);background:var(--coral-soft)}.exec-layout{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start;margin-top:20px;border-top:2px dashed var(--indigo-soft);padding-top:20px}.exec-code{flex:1;min-width:320px}.exec-trace{flex:1.5;min-width:320px;display:flex;flex-direction:column;gap:15px}.table-responsive{width:100%;overflow-x:auto;border-radius:10px;box-shadow:var(--shadow);max-height:350px;overflow-y:auto;background:#fff}.trace-table{width:100%;border-collapse:collapse;font-family:'JetBrains Mono',monospace;font-size:13px;text-align:center}.trace-table th{background:var(--indigo-deep);color:#fff;padding:10px 8px;font-weight:600;position:sticky;top:0;z-index:2}.trace-table td{padding:8px 6px;border:1px solid var(--indigo-soft);color:var(--ink);transition:background .3s}.trace-table tr:nth-child(even) td{background:var(--bg)}.trace-table td.changed{font-weight:800;color:var(--coral);background:var(--coral-soft)!important}.console-out{background:#111A2E;color:#4AF626;font-family:'JetBrains Mono',monospace;padding:16px;border-radius:10px;min-height:80px;font-size:14px;box-shadow:inset 0 2px 10px rgba(0,0,0,0.6);overflow-y:auto;max-height:150px}.console-out-title{font-size:11px;color:#8A9AB8;margin-bottom:8px;text-transform:uppercase;font-weight:bold;letter-spacing:0.05em}.hint{font-size:12.5px;color:var(--ink-soft);margin-top:10px;font-style:italic}
</style>

<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n){if(n===null||n===undefined)return'—';if(!isFinite(n)&&typeof n!=='string')return'—';if(typeof n==='string')return n;return(Math.round(n*100)/100).toString().replace('.',',');}
const KS=['Αλγόριθμος','ΔΙΑΒΑΣΕ','Διάβασε','ΓΡΑΨΕ','Γράψε','Εμφάνισε','ΤΕΛΟΣ_ΑΝ','Τέλος_αν','ΤΕΛΟΣ_ΕΠΙΛΟΓΩΝ','Τέλος_επιλογών','Τέλος','ΕΠΙΛΕΞΕ','Επίλεξε','ΠΕΡΙΠΤΩΣΗ','περίπτωση','ΑΡΧΗ','ΠΡΟΓΡΑΜΜΑ','ΜΕΤΑΒΛΗΤΕΣ','ΑΚΕΡΑΙΕΣ','ΠΡΑΓΜΑΤΙΚΕΣ','ΧΑΡΑΚΤΗΡΕΣ','ΤΕΛΟΣ_ΠΡΟΓΡΑΜΜΑΤΟΣ'];
const KC=['ΑΝ ','Αν ','ΤΟΤΕ','τότε','ΑΛΛΙΩΣ_ΑΝ','Αλλιώς_αν','Αλλιώς αν','ΑΛΛΙΩΣ','αλλιώς'];

function hL(raw){
  let l=esc(raw).replace(/<-/g,'<span class="tk-arrow">&lt;-</span>').replace(/←/g,'<span class="tk-arrow">←</span>');
  l=l.replace(/\b(DIV|div|MOD|mod|KAI|και|Η|ή|ΟΧΙ|όχι)\b/g,'<span class="tk-kw2">$1</span>');
  for(let w of KS) if(l.trim().startsWith(w)) l=l.replace(w,`<span class="tk-kw">${w}</span>`);
  for(let w of KC) if(l.includes(w)) l=l.replace(w,`<span class="tk-cond">${w}</span>`);
  return l;
}

function rC(lines,id){return `<pre class="code" id="code-${id}">${lines.map((l,i)=>`<div class="code-line" id="line-${id}-${i}">${hL(l)}</div>`).join('')}</pre>`;}

function cR(vN, log){
  return function(v){
    let s={}, t=[];
    function r(l,u,p){if(u)Object.assign(s,u);t.push({line:l,vars:{...s},pr:p});}
    log(v,r); return {varNames:vN, trace:t};
  };
}

const EXERCISES = [
{id:'1', cat:'Απλή Επιλογή', title:'Βαθμός (ΑΡΙΣΤΟΣ)',
 statement:'Να γραφεί τμήμα αλγορίθμου που θα διαβάζει το βαθμό ενός μαθητή και θα εμφανίζει το μήνυμα ΑΡΙΣΤΟΣ, αν ο βαθμός του είναι μεγαλύτερος από 18 .',
 code:['ΔΙΑΒΑΣΕ βαθ','ΑΝ βαθ > 18 ΤΟΤΕ','  ΓΡΑΨΕ \'ΑΡΙΣΤΟΣ\'','ΤΕΛΟΣ_ΑΝ'], inputs:[{id:'v',label:'βαθ'}],
 run: cR(['βαθ'],(v,s)=>{s(0,{'βαθ':v.v}); s(1); if(v.v>18) s(2,null,['ΑΡΙΣΤΟΣ']); s(3);})},
{id:'2', cat:'Απλή Επιλογή', title:'Λογαριασμός ΔΕΗ',
 statement:'Μια οικογένεια κατανάλωσε X Kwh (κιλοβατώρες) ημερήσιου ρεύματος και Υ Kwh νυχτερινού ρεύματος. Το κόστος ημερήσιου ρεύματος είναι 0,5€ ανά Kwh και του νυχτερινού 0,25€ ανά Kwh. Να αναπτύξετε έναν αλγόριθμο ο οποίος: α. να διαβάζει τα Χ, Υ <br>β. να υπολογίζει και να εμφανίζει το συνολικό κόστος.<br> γ. να εμφανίζει το μήνυμα ΥΠΕΡΒΟΛΙΚΗ ΚΑΤΑΝΑΛΩΣΗ, αν το συνολικό κόστος είναι μεγαλύτερο από 300€ .',
 code:['Αλγόριθμος ΔΕΗ','ΔΙΑΒΑΣΕ X, Y','ΚΟΣΤΟΣ <- X*0.5 + Y*0.25','ΓΡΑΨΕ ΚΟΣΤΟΣ','ΑΝ ΚΟΣΤΟΣ > 300 ΤΟΤΕ','  ΓΡΑΨΕ \'ΥΠΕΡΒΟΛΙΚΗ ΚΑΤΑΝΑΛΩΣΗ\'','ΤΕΛΟΣ_ΑΝ','Τέλος ΔΕΗ'], inputs:[{id:'x',label:'X'},{id:'y',label:'Y'}],
 run: cR(['X','Y','ΚΟΣΤΟΣ'],(v,s)=>{s(0); s(1,{'X':v.x,'Y':v.y}); let c=v.x*0.5+v.y*0.25; s(2,{'ΚΟΣΤΟΣ':c}); s(3,null,[fmt(c)]); s(4); if(c>300) s(5,null,['ΥΠΕΡΒΟΛΙΚΗ ΚΑΤΑΝΑΛΩΣΗ']); s(6); s(7);})},
{id:'3', cat:'Απλή Επιλογή', title:'Πολλαπλάσιο αριθμού',
 statement:'Να αναπτυχθεί πρόγραμμα, που να διαβάζει δύο ακέραιους αριθμούς Χ και Υ και να εμφανίζει μήνυμα στην περίπτωση που ο Χ είναι πολλαπλάσιο του Υ .',
 code:['ΠΡΟΓΡΑΜΜΑ πολλαπλάσιο','ΔΙΑΒΑΣΕ Χ, Υ','ΑΝ X MOD Y = 0 ΤΟΤΕ','  ΓΡΑΨΕ \'ο Υ διαιρεί τον Χ\'','ΤΕΛΟΣ_ΑΝ','ΤΕΛΟΣ_ΠΡΟΓΡΑΜΜΑΤΟΣ'], inputs:[{id:'x',label:'X'},{id:'y',label:'Y'}],
 run: cR(['Χ','Υ'],(v,s)=>{s(0); s(1,{'Χ':v.x,'Υ':v.y}); s(2); if(v.y!==0 && v.x%v.y===0) s(3,null,['ο Υ διαιρεί τον Χ']); s(4); s(5);})},
{id:'4', cat:'Απλή Επιλογή', title:'Επιχορήγηση Υπουργείου',
 statement:'Το Υπουργείο Ενέργειας προσφέρει επιχορήγηση 30% επί των εξόδων αναβάθμισης του κάθε κτιρίου. Το μέγιστο ποσό επιχορήγησης ανά κτίριο είναι τα €1500. Να γραφεί αλγόριθμος που: <br>(α) Να δέχεται το ποσό των εξόδων αναβάθμισης που χρειάζεται για τη θερμομόνωση ενός υφιστάμενου κτιρίου. <br>(β) Να υπολογίζει και θα εμφανίζει το ποσό της επιχορήγησης σε ευρώ που θα πάρει ο πολίτης, ανάλογα με το σχέδιο επιχορήγησης όπως αυτό έχει περιγραφεί πιο πάνω.',
 code:['Αλγόριθμος υπουργειο','Διάβασε ποσο','επιχ <- 30/100 * ποσο','Αν επιχ > 1500 τότε','  επιχ <- 1500','Τέλος_αν','Γράψε επιχ','Τέλος υπουργειο'], inputs:[{id:'p',label:'ποσο'}],
 run: cR(['ποσο','επιχ'],(v,s)=>{s(0); s(1,{'ποσο':v.p}); let e=0.3*v.p; s(2,{'επιχ':e}); s(3); if(e>1500){e=1500; s(4,{'επιχ':e});} s(5); s(6,null,[fmt(e)]); s(7);})},
{id:'5', cat:'Σύνθετη Επιλογή', title:'Βαθμός (ΑΡΙΣΤΟΣ/ΚΑΛΟΣ)',
 statement:'Να γραφεί αλγόριθμος που θα διαβάζει το βαθμό ενός μαθητή και θα εμφανίζει το μήνυμα ΑΡΙΣΤΟΣ, αν ο βαθμός του είναι μεγαλύτερος από 18 και το μήνυμα ΚΑΛΟΣ , σε αντίθετη περίπτωση .',
 code:['ΔΙΑΒΑΣΕ βαθ','ΑΝ βαθ > 18 ΤΟΤΕ','  ΓΡΑΨΕ \'ΑΡΙΣΤΟΣ\'','ΑΛΛΙΩΣ','  ΓΡΑΨΕ \'ΚΑΛΟΣ\'','ΤΕΛΟΣ_ΑΝ'], inputs:[{id:'v',label:'βαθ'}],
 run: cR(['βαθ'],(v,s)=>{s(0,{'βαθ':v.v}); s(1); if(v.v>18) s(2,null,['ΑΡΙΣΤΟΣ']); else{s(3); s(4,null,['ΚΑΛΟΣ']);} s(5);})},
{id:'6', cat:'Σύνθετη Επιλογή', title:'Άρτιος ή Περιττός',
 statement:'Να αναπτυχθεί αλγόριθμος, που να διαβάζει έναν ακέραιο αριθμό και να εμφανίζει μήνυμα σχετικά με το αν είναι άρτιος ή περιττός .',
 code:['Αλγόριθμος αριθμος','Διάβασε Χ','Αν Χ mod 2 = 0 τότε','  Γράψε \'ΑΡΤΙΟΣ\'','αλλιώς','  Γράψε \'ΠΕΡΙΤΤΟΣ\'','Τέλος_αν','Τέλος αριθμος'], inputs:[{id:'x',label:'Χ'}],
 run: cR(['Χ'],(v,s)=>{s(0); s(1,{'Χ':v.x}); s(2); if(v.x%2===0) s(3,null,['ΑΡΤΙΟΣ']); else{s(4); s(5,null,['ΠΕΡΙΤΤΟΣ']);} s(6); s(7);})},
{id:'7', cat:'Σύνθετη Επιλογή', title:'Μεγαλύτερος από 2 (MAX)',
 statement:'Να γραφεί ένας αλγόριθμος που θα διαβάζει 2 αριθμούς και να εμφανίζει τον μεγαλύτερο από αυτούς .',
 code:['Αλγόριθμος αριθμοι','Διάβασε α, β','max <- α','Αν β > max τότε','  max <- β','Τέλος_αν','Γράψε max','Τέλος αριθμοι'], inputs:[{id:'a',label:'α'},{id:'b',label:'β'}],
 run: cR(['α','β','max'],(v,s)=>{s(0); s(1,{'α':v.a,'β':v.b}); let m=v.a; s(2,{'max':m}); s(3); if(v.b>m){m=v.b; s(4,{'max':m});} s(5); s(6,null,[fmt(m)]); s(7);})},
{id:'8', cat:'Σύνθετη Επιλογή', title:'Απόλυτη τιμή (χωρίς Α_Τ)',
 statement:'Να γραφεί ένας αλγόριθμος που θα διαβάζει έναν αριθμό και να εμφανίζει την απόλυτη τιμή του, χρησιμοποιώντας μόνο μία απλή ΑΝ και χωρίς χρήση της συνάρτησης Α_Τ(x) .',
 code:['Αλγόριθμος απόλυτη','Διάβασε α','Αν α < 0 τότε','  α <- (-1)*α','Τέλος_αν','Γράψε α','Τέλος απόλυτη'], inputs:[{id:'a',label:'α'}],
 run: cR(['α'],(v,s)=>{s(0); s(1,{'α':v.a}); s(2); let a=v.a; if(a<0){a=-1*a; s(3,{'α':a});} s(4); s(5,null,[fmt(a)]); s(6);})},
{id:'9', cat:'Σύνθετη Επιλογή', title:'Ναυτιλιακή (Κόστος Μεταφοράς)',
 statement:`Μια ναυτιλιακή εταιρεία εφαρμόζει την τιμολογιακή πολιτική που φαίνεται στον παρακάτω πίνακα, σε ένα μεταφορικό της πλοίο, σε σχέση με τα επιβατικά αυτοκίνητα που μεταφέρονται:
<br>
<table style="border-collapse:collapse;margin:0 auto;font-size:14px;">
  <tr>
    <th style="border:1px solid #999;padding:8px 16px;background:#f0f0f0;">Βάρος οχήματος</th>
    <th style="border:1px solid #999;padding:8px 16px;background:#f0f0f0;">Χρέωση</th>
  </tr>
  <tr>
    <td style="border:1px solid #999;padding:8px 16px;">έως και 1500 κιλά</td>
    <td style="border:1px solid #999;padding:8px 16px;">50 ευρώ το όχημα</td>
  </tr>
  <tr>
    <td style="border:1px solid #999;padding:8px 16px;">Πάνω από 1500 κιλά</td>

<br>
<strong>Δ1.</strong> Να διαβάζει το βάρος ενός οχήματος και τον αριθμό των επιβατών του<br>
<strong>Δ2.</strong> Να υπολογίζει το κόστος για το όχημα αυτό με βάση το βάρος του.<br>
<strong>Δ3.</strong> Να εμφανίζει το συνολικό κόστος των επιβατών και του οχήματος.`,
 code:['Αλγόριθμος πλοιο','Διάβασε βαρ, αρεπ','Αν βαρ <= 1500 τότε','  χρ1 <- 50','αλλιώς','  χρ1 <- 70','Τέλος_αν','χρ2 <- (αρεπ-1)*15','ποσο <- χρ1 + χρ2','Γράψε ποσο','Τέλος πλοιο'],

 code:['Αλγόριθμος πτηση','Διάβασε αρχτιμη, μιλ','Αν μιλ > 4000 τότε','  εκπ <- 10/100*αρχτιμη','αλλιώς','  εκπ <- 0','Τέλος_αν','ποσο <- αρχτιμη - εκπ','Γράψε ποσο','Τέλος πτηση'], inputs:[{id:'a',label:'αρχτιμη'},{id:'m',label:'μιλ'}],

{id:'11', cat:'Σύνθετη Επιλογή', title:'Χώρος Στάθμευσης',
 statement:`Μια εταιρεία ενοικιάσεων χώρων στάθμευσης στο αεροδρόμιο, χρεώνει για τη στάθμευση ενός αυτοκινήτου, έξι (6) ευρώ την ημέρα. Αν ο πελάτης σταθμεύσει το αυτοκίνητό του περισσότερο από επτά (7) ημέρες, δίνεται έκπτωση 20% πάνω στη συνολική τιμή.

<br>

<strong>(β)</strong> Να υπολογίζει και να εμφανίζει το τελικό ποσό (σε ευρώ) που πρέπει να πληρώσει ο πελάτης.`,
 code:['Αλγόριθμος εταιρεια','Διάβασε ημερ','ποσο <- ημερ*6','Αν ημερ > 7 τότε','  εκπ <- 20/100*ποσο','αλλιώς','  εκπ <- 0','Τέλος_αν','τπ <- ποσο - εκπ','Γράψε τπ','Τέλος εταιρεια'], inputs:[{id:'i',label:'ημερ'}],

{id:'12', cat:'Σύνθετη Επιλογή', title:'Εκδρομή Σχολείου',

<strong>(β)</strong> Να υπολογίζει το ποσό της έκπτωσης καθώς και το τελικό ποσό (τελικό ποσό = συνολική τιμή - έκπτωση) που πρέπει να πληρώσει το σχολείο.<br>

<strong>(γ)</strong> Να τυπώνει το ποσό της έκπτωσης καθώς και το τελικό ποσό που πρέπει να πληρώσει το σχολείο, όπως έχουν υπολογιστεί στο ερώτημα (β).`,
 code:['ΠΡΟΓΡΑΜΜΑ εκδρομη','ΔΙΑΒΑΣΕ πλ_λεωφ','ποσο <- πλ_λεωφ*50','ΑΝ πλ_λεωφ > 5 ΤΟΤΕ','  εκπ <- ποσο*20/100','ΑΛΛΙΩΣ','  εκπ <- ποσο*10/100','ΤΕΛΟΣ_ΑΝ','κοστος <- ποσο - εκπ','ΓΡΑΨΕ εκπ, κοστος','ΤΕΛΟΣ_ΠΡΟΓΡΑΜΜΑΤΟΣ'], inputs:[{id:'pl',label:'πλ_λεωφ'}],

{id:'13', cat:'Πολλαπλή Επιλογή', title:'Μισθός & Οικογενειακό Επίδομα',
 statement:`Ο μισθός ενός υπαλλήλου προκύπτει από τον μηνιαίο βασικό μισθό και τον αριθμό των παιδιών του. Οι συνολικές αποδοχές του υπολογίζονται ως το άθροισμα του μηνιαίου βασικού μισθού και του οικογενειακού επιδόματός του.

Το οικογενειακό επίδομα υπολογίζεται ως εξής: 30 € για κάθε παιδί μέχρι και τρία παιδιά, και 40 € για κάθε παιδί πέραν των τριών (4ο, 5ο, 6ο κ.τ.λ.).

 code:['Αλγόριθμος μισθος','Διάβασε βμ, πλπ','Αν πλπ <= 3 τότε','  οικ <- 30*πλπ','αλλιώς','  οικ <- 3*30 + (πλπ-3)*40','Τέλος_αν','μ <- βμ + οικ','Γράψε οικ, μ','Τέλος μισθος'], inputs:[{id:'b',label:'βμ'},{id:'p',label:'πλπ'}],

{id:'14', cat:'Πολλαπλή Επιλογή', title:'Κόστος Οικοδομής (Πολεοδομία)',
 statement:'Το κόστος της πολεοδομικής άδειας για οικοδομή μέχρι 6 ορόφους, ανέρχεται σε 500 ευρώ ανά όροφο. Αν η οικοδομή ξεπερνάει τους 6 ορόφους, το κόστος γίνεται 700 ευρώ για κάθε επιπλέον όροφο. Η αμοιβή του μηχανικού που κάνει τη μελέτη είναι 1000 ευρώ και 1500 ευρώ αντίστοιχα. Σε πολυώροφες οικοδομές (πάνω από 10 ορόφους) υπάρχει μία επιπλέον επιβάρυνση 5,000 ευρώ για φόρος πολυτέλειας. Κατασκευάστε πρόγραμμα που θα διαβάζει το πλήθος των ορόφων και θα υπολογίζει και εμφανίζει το κόστος της άδειας, την αμοιβή του μηχανικού και τη συνολική δαπάνη.',
 code:['Αλγόριθμος οικοδομη','Διάβασε πλορ','Αν πλορ <= 6 τότε','  χρ_αδειας <- πλορ*500','  χρ_μηχ <- 1000','αλλιώς','  χρ_αδειας <- 6*500 + (πλορ-6)*700','  χρ_μηχ <- 1500','Τέλος_αν','Αν πλορ > 10 τότε','  φορος <- 5000','αλλιώς','  φορος <- 0','Τέλος_αν','δαπανη <- χρ_αδειας + χρ_μηχ + φορος','Γράψε χρ_αδειας, χρ_μηχ, δαπανη','Τέλος οικοδομη'], inputs:[{id:'pl',label:'πλορ'}],

{id:'15', cat:'Πολλαπλή Επιλογή', title:'Ευρωπαϊκό Πακέτο Στήριξης',
 statement:'Το κόστος της πολεοδομικής άδειας για οικοδομή μέχρι 6 ορόφους, ανέρχεται σε 500 ευρώ ανά όροφο. Αν η οικοδομή ξεπερνάει τους 6 ορόφους, το κόστος γίνεται 700 ευρώ για κάθε επιπλέον όροφο. Η αμοιβή του μηχανικού που κάνει τη μελέτη είναι 1000 ευρώ και 1500 ευρώ αντίστοιχα. Σε πολυώροφες οικοδομές (πάνω από 10 ορόφους) υπάρχει μία επιπλέον επιβάρυνση 5,000 ευρώ για φόρος πολυτέλειας. Κατασκευάστε πρόγραμμα που θα διαβάζει το πλήθος των ορόφων και θα υπολογίζει και εμφανίζει το κόστος της άδειας, την αμοιβή του μηχανικού και τη συνολική δαπάνη.',
 code:['Αλγόριθμος πακετο','Διάβασε πλεργ, πλ28, απασχ','Αν πλεργ <= 15 τότε','  επιδ1 <- 20000','αλλιώς','  επιδ1 <- 35000','Τέλος_αν','ποσ <- πλ28/πλεργ*100','Αν ποσ > 35 ΚΑΙ απασχ = \'ΝΑΙ\' τότε','  επιδ2 <- 10000','αλλιώς','  επιδ2 <- 0','Τέλος_αν','τεπ <- επιδ1 + επιδ2','Γράψε τεπ','Τέλος πακετο'], inputs:[{id:'pe',label:'πλεργ'},{id:'p28',label:'πλ28'},{id:'ap',label:'απασχ (ΝΑΙ/ΟΧΙ)', type:'text'}],

{id:'16', cat:'Πολλαπλή Επιλογή', title:'Αριθμός Νάρκισσος',

<strong>β)</strong> υπολογίζει το κόστος διοργάνωσης του σεμιναρίου και<br>

 code:['Αλγόριθμος ΚΕΚ','Διάβασε πλεπ','Αν πλεπ <= 20 τότε','  κοστος <- πλεπ*285','αλλιώς_αν πλεπ <= 60 τότε','  κοστος <- πλεπ*260','αλλιώς_αν πλεπ <= 120 τότε','  κοστος <- πλεπ*230','αλλιώς','  κοστος <- πλεπ*200','Τέλος_αν','εσοδα <- 350*πλεπ','κερδος <- εσοδα - κοστος','Γράψε κοστος, κερδος','Τέλος ΚΕΚ'], inputs:[{id:'pe',label:'πλεπ'}],

{id:'21', cat:'Πολλαπλή Επιλογή', title:'Διόδια με μαγνητική κάρτα',
 statement:`Με το νέο σύστημα πληρωμής των διοδίων, οι οδηγοί των τροχοφόρων έχουν τη δυνατότητα να πληρώνουν το αντίτιμο των διοδίων με ειδική μαγνητική κάρτα.

Υποθέστε ότι υπάρχει μηχάνημα το οποίο διαθέτει είσοδο για την κάρτα και φωτοκύτταρο. Το μηχάνημα διαβάζει από την κάρτα το υπόλοιπο των χρημάτων και το αποθηκεύει σε μία μεταβλητή <strong>Υ</strong> και, με το φωτοκύτταρο, αναγνωρίζει τον τύπο του τροχοφόρου και το αποθηκεύει σε μία μεταβλητή <strong>Τ</strong>.

<br>

Υπάρχουν τρεις τύποι τροχοφόρων:

<table style="border-collapse:collapse;margin:14px auto;font-size:15px;min-width:480px;">

    <td style="border:1px solid #999;padding:8px 14px;text-align:center;">1 €</td>
  </tr>

Να αναπτύξετε πρόγραμμα που:

<br>

<strong>α.</strong> Θα διαβάζει τον τύπο του τροχοφόρου (<strong>Τ</strong>) και το υπόλοιπο της κάρτας (<strong>Υ</strong>), θα ελέγχει τον τύπο του τροχοφόρου και θα εκχωρεί στη μεταβλητή <strong>Α</strong> το αντίτιμο των διοδίων, ανάλογα με τον τύπο του τροχοφόρου.

<br>

<strong>β.</strong> Ελέγχει την πληρωμή των διοδίων με τον παρακάτω τρόπο:<br>

• Αν το υπόλοιπο της κάρτας επαρκεί για την πληρωμή του αντιτίμου των διοδίων, αφαιρεί το ποσό αυτό από την κάρτα.<br>

• Αν η κάρτα δεν έχει υπόλοιπο, το μηχάνημα ειδοποιεί με μήνυμα για το ποσό που πρέπει να πληρωθεί.<br>

• Αν το υπόλοιπο δεν επαρκεί, μηδενίζεται η κάρτα και δίνεται με μήνυμα το ποσό που απομένει να πληρωθεί.`,
 code:['Αλγόριθμος διοδια','Διάβασε Υ, Τ','Αν Τ = \'Δ\' τότε','  Α <- 1','αλλιώς_αν Τ = \'Ε\' τότε','  Α <- 2','αλλιώς','  Α <- 3','Τέλος_αν','Αν Υ >= Α τότε','  Υ <- Υ - Α','αλλιώς_αν Υ = 0 τότε','  Γράψε \'ΠΛΗΡΩΜΗ=\', Α','αλλιώς','  Γράψε Α - Υ','  Υ <- 0','Τέλος_αν','Τέλος διοδια'], inputs:[{id:'y',label:'Υ'}, {id:'t',label:'Τ (Δ/Ε/Φ)', type:'text'}],
 run: cR(['Υ','Τ','Α'],(v,s)=>{s(0); s(1,{'Υ':v.y,'Τ':v.t}); s(2); let a=0; if(v.t==='Δ'){a=1; s(3,{'Α':a});}else{s(4); if(v.t==='Ε'){a=2; s(5,{'Α':a});}else{s(6); a=3; s(7,{'Α':a});}} s(8); s(9); if(v.y>=a){v.y-=a; s(10,{'Υ':v.y});}else{s(11); if(v.y===0){s(12,null,['ΠΛΗΡΩΜΗ='+fmt(a)]);}else{s(13); s(14,null,[fmt(a-v.y)]); v.y=0; s(15,{'Υ':v.y});}} s(16);s(17);})},
{id:'22', cat:'Κλιμακωτός Υπολογισμός', title:'Γυμναστήριο (Έκπτωση Μηνών)',
 statement:'Το γυμναστήριο "Λεπτή υπόθεση" ανακοίνωσε προσφορές για τους νέους πελάτες. Έτσι, παρέχει δωρεάν έναν μήνα, ενώ για κάθε επιπλέον μήνα υπάρχει χρέωση 30€. Ωστόσο, αν η συνδρομή ξεπεράσει τους 18 μήνες, υπάρχει έκπτωση 8%, ενώ για συνδρομή πάνω από 24 μήνες η έκπτωση γίνεται 15%. Να γραφεί αλγόριθμος που θα διαβάζει τους μήνες της συνδρομής ενός πελάτη και θα εμφανίζει το οφειλόμενο ποσό στο γυμναστήριο.',
 code:['Αλγόριθμος gym','Διάβασε μ','ποσο <- (μ - 1)*30','Αν μ <= 18 τότε','  εκπ <- 0','αλλιώς_αν μ <= 24 τότε','  εκπ <- 8/100*ποσο','αλλιώς','  εκπ <- 15/100*ποσο','Τέλος_αν','τπ <- ποσο - εκπ','Γράψε τπ','Τέλος gym'], inputs:[{id:'m',label:'μ'}],
 run: cR(['μ','ποσο','εκπ','τπ'],(v,s)=>{s(0); s(1,{'μ':v.m}); let p=(v.m-1)*30; s(2,{'ποσο':p}); s(3); let e=0; if(v.m<=18){e=0; s(4,{'εκπ':e});}else{s(5); if(v.m<=24){e=0.08*p; s(6,{'εκπ':e});}else{s(7); e=0.15*p; s(8,{'εκπ':e});}} s(9); let tp=p-e; s(10,{'τπ':tp}); s(11,null,[fmt(tp)]); s(12);})},
{id:'23', cat:'Πολλαπλή Επιλογή', title:'Στρατός (Διμοιρίες)',
 statement:`Σε ένα κέντρο νεοσύλλεκτων υπάρχει η πρόθεση να δημιουργηθούν δύο ειδικές διμοιρίες.

Η <strong>διμοιρία Α</strong> θα αποτελείται από νεοσύλλεκτους πτυχιούχους τριτοβάθμιας εκπαίδευσης, ηλικίας από <strong>24 έως και 28 χρόνων</strong>.

      Επίπεδο σπουδών
    </th>
  </tr>

    <td style="border:1px solid #999;padding:8px 14px;text-align:center;"><strong>1</strong></td>
    <td style="border:1px solid #999;padding:8px 14px;">Τριτοβάθμια εκπαίδευση</td>
  </tr>

  <tr>
    <td style="border:1px solid #999;padding:8px 14px;text-align:center;"><strong>2</strong></td>
    <td style="border:1px solid #999;padding:8px 14px;">Δευτεροβάθμια εκπαίδευση</td>
  </tr>

  <tr>
    <td style="border:1px solid #999;padding:8px 14px;text-align:center;"><strong>3</strong></td>

<strong>β.</strong> Εκτυπώνει το ονοματεπώνυμο του νεοσύλλεκτου και το όνομα της διμοιρίας (<strong>Α</strong> ή <strong>Β</strong>), εφόσον ο νεοσύλλεκτος κατατάσσεται σε μία από αυτές. Σε αντίθετη περίπτωση να εμφανίζει αντίστοιχο μήνυμα.`,
 code:['Αλγόριθμος στρατος','Διάβασε ον, ηλ, επσ','Αν ηλ >= 24 ΚΑΙ ηλ <= 28 ΚΑΙ επσ = 1 τότε','  Γράψε ον, \'1η Δ\'','αλλιώς_αν ηλ >= 18 ΚΑΙ ηλ <= 24 ΚΑΙ επσ = 2 τότε','  Γράψε ον, \'2η Δ\'','αλλιώς','  Γράψε ον, \'Καμία Διμοιρία\'','Τέλος_αν','Τέλος στρατος'], inputs:[{id:'on',label:'ον', type:'text'}, {id:'il',label:'ηλ'}, {id:'eps',label:'επσ (1-3)'}],
 run: cR(['ον','ηλ','επσ'],(v,s)=>{s(0); s(1,{'ον':v.on,'ηλ':v.il,'επσ':v.eps}); s(2); if(v.il>=24 && v.il<=28 && v.eps===1) s(3,null,[v.on+', 1η Δ']); else{s(4); if(v.il>=18 && v.il<=24 && v.eps===2) s(5,null,[v.on+', 2η Δ']); else{s(6); s(7,null,[v.on+', Καμία Διμοιρία']);}} s(8);s(9);})},

 code:['ΠΡΟΓΡΑΜΜΑ εταιρεία','ΔΙΑΒΑΣΕ Kw','ΑΝ Kw <= 200 ΤΟΤΕ','  ποσό <- Kw * 0.10','ΑΛΛΙΩΣ_ΑΝ Kw <= 1200 ΤΟΤΕ','  ποσό <- 200*0.10 + (Kw - 200)*0.20','ΑΛΛΙΩΣ','  ποσό <- 200*0.10 + 1000*0.20 + (Kw - 1200)*0.30','ΤΕΛΟΣ_ΑΝ','ΓΡΑΨΕ ποσό','ΤΕΛΟΣ_ΠΡΟΓΡΑΜΜΑΤΟΣ'], inputs:[{id:'k',label:'Kw'}],

 code:['ΠΡΟΓΡΑΜΜΑ καταστημα','ΔΙΑΒΑΣΕ ον, ποσο','ΑΝ ποσο <= 300 ΤΟΤΕ','  εκπ <- ποσο*2/100','ΑΛΛΙΩΣ_ΑΝ ποσο <= 400 ΤΟΤΕ','  εκπ <- 300*2/100 + (ποσο-300)*5/100','ΑΛΛΙΩΣ','  εκπ <- 300*2/100 + 100*5/100 + (ποσο-400)*7/100','ΤΕΛΟΣ_ΑΝ','χρ <- ποσο - εκπ','ΓΡΑΨΕ ον, χρ','ΤΕΛΟΣ_ΠΡΟΓΡΑΜΜΑΤΟΣ'], inputs:[{id:'on',label:'ον', type:'text'}, {id:'p',label:'ποσο'}],

{id:'26', cat:'Κλιμακωτός Υπολογισμός', title:'Σχολή οδηγών',
 statement:`Μία σχολή οδηγών προσφέρει στους πελάτες τα ακόλουθα:

Οι δύο πρώτες ώρες μαθήματος είναι δωρεάν, ενώ από τις τρεις μέχρι και τις είκοσι ώρες κοστίζει 25 € η ώρα. Αν όμως ο πελάτης κάνει πάνω από είκοσι ώρες, τότε για κάθε επιπλέον ώρα άνω των είκοσι πληρώνει 20 €.

Τέλος, αν το συνολικό κόστος για τον πελάτη υπερβαίνει τα 800 €, τότε η σχολή κάνει 16% έκπτωση στον πελάτη.

<strong>β.</strong> θα υπολογίζει το συνολικό κόστος των μαθημάτων,<br>

<strong>γ.</strong> θα εκτυπώνει το μήνυμα <strong>"ΚΟΣΤΟΣ"</strong> και το συνολικό κόστος.`,
 code:['Αλγόριθμος οδηγος','Διάβασε ωρ','Αν ωρ <= 2 τότε','  χρ <- 0','αλλιώς_αν ωρ <= 20 τότε','  χρ <- (ωρ-2)*25','αλλιώς','  χρ <- 18*25 + (ωρ-20)*20','Τέλος_αν','Αν χρ > 800 τότε','  εκπ <- 16/100*χρ','αλλιώς','  εκπ <- 0','Τέλος_αν','ποσο <- χρ - εκπ','Γράψε ποσο','Τέλος οδηγος'], inputs:[{id:'w',label:'ωρ'}],
 run: cR(['ωρ','χρ','εκπ','ποσο'],(v,s)=>{s(0); s(1,{'ωρ':v.w}); s(2); let xr=0; if(v.w<=2){xr=0; s(3,{'χρ':xr});}else{s(4); if(v.w<=20){xr=(v.w-2)*25; s(5,{'χρ':xr});}else{s(6); xr=18*25+(v.w-20)*20; s(7,{'χρ':xr});}} s(8); s(9); let ekp=0; if(xr>800){ekp=0.16*xr; s(10,{'εκπ':ekp});}else{s(11); ekp=0; s(12,{'εκπ':ekp});} s(13); let poso=xr-ekp; s(14,{'ποσο':poso}); s(15,null,[fmt(poso)]); s(16);})},

    <td style="border:1px solid #999;padding:7px 14px;text-align:center;">
      8,5 ανά διέλευση
    </td>
  </tr>

  <tr>
    <td style="border:1px solid #999;padding:7px 14px;text-align:center;">
      Οι επιπλέον διελεύσεις
    </td>
    <td style="border:1px solid #999;padding:7px 14px;text-align:center;">
      8 ανά διέλευση
    </td>
  </tr>
</table>

<br>

Να αναπτύξετε αλγόριθμο ο οποίος:<br>

<strong>α)</strong> διαβάζει τον αριθμό διελεύσεων τριμήνου ενός οχήματος με κάρτα,<br>

<strong>β)</strong> υπολογίζει και εμφανίζει το συνολικό κόστος,<br>

<strong>γ)</strong> αν το κόστος διέλευσης χωρίς κάρτα είναι 9,8 Ευρώ ανά διέλευση, εμφανίζει το μήνυμα <strong>«Η ΚΑΡΤΑ ΣΥΜΦΕΡΕΙ»</strong> αν το συνολικό κόστος με χρήση κάρτας είναι μικρότερο.`,
 code:['Αλγόριθμος διοδια','Διάβασε αρδ','Αν αρδ <= 10 τότε','  ποσο <- 0','αλλιώς_αν αρδ <= 15 τότε','  ποσο <- (αρδ-10)*9.2','αλλιώς_αν αρδ <= 25 τότε','  ποσο <- 5*9.2 + (αρδ-15)*8.5','αλλιώς','  ποσο <- 5*9.2 + 10*8.5 + (αρδ-25)*8','Τέλος_αν','ΤΠ <- 50 + ποσο','Γράψε ΤΠ','Αν ΤΠ < 9.8*αρδ τότε','  Γράψε \'Η κάρτα συμφέρει\'','Τέλος_αν','Τέλος διοδια'], inputs:[{id:'a',label:'αρδ'}],
 run: cR(['αρδ','ποσο','ΤΠ'],(v,s)=>{s(0); s(1,{'αρδ':v.a}); s(2); let p=0; if(v.a<=10){p=0; s(3,{'ποσο':p});}else{s(4); if(v.a<=15){p=(v.a-10)*9.2; s(5,{'ποσο':p});}else{s(6); if(v.a<=25){p=5*9.2+(v.a-15)*8.5; s(7,{'ποσο':p});}else{s(8); p=5*9.2+10*8.5+(v.a-25)*8; s(9,{'ποσο':p});}}} s(10); let tp=50+p; s(11,{'ΤΠ':tp}); s(12,null,[fmt(tp)]); s(13); if(tp<9.8*v.a) s(14,null,['Η κάρτα συμφέρει']); s(15); s(16);})},
{id:'28', cat:'Κλιμακωτός Υπολογισμός', title:'Νερό',
 statement:`Ο δήμος Τενεούπολης χρεώνει κλιμακωτά την παροχή νερού στους δημότες του, ανάλογα με την κατανάλωσή τους σε κυβικά μέτρα ανά τρίμηνο, ως εξής:

<br>

<table style="border-collapse:collapse;margin:0 auto;font-size:15px;min-width:520px;">
  <tr>
    <th style="border:1px solid #999;padding:8px 14px;background:#dcefed;">
      Κατανάλωση σε κυβικά
    </th>
    <th style="border:1px solid #999;padding:8px 14px;background:#dcefed;">
      Χρέωση € ανά κυβικό
    </th>
  </tr>

  <tr>
    <td style="border:1px solid #999;padding:7px 14px;text-align:center;">
      μέχρι και 50
    </td>
    <td style="border:1px solid #999;padding:7px 14px;text-align:center;">
      2 €
    </td>
  </tr>

  <tr>
    <td style="border:1px solid #999;padding:7px 14px;text-align:center;">
      από 51 μέχρι και 100
    </td>
    <td style="border:1px solid #999;padding:7px 14px;text-align:center;">
      5 €
    </td>
  </tr>

  <tr>
    <td style="border:1px solid #999;padding:7px 14px;text-align:center;">
      πάνω από 100
    </td>
    <td style="border:1px solid #999;padding:7px 14px;text-align:center;">
      9 €
    </td>
  </tr>
</table>

<br>

Η δημοτική επιχείρηση έχει ορίσει ως <strong>ελάχιστη κατανάλωση τα 10 κυβικά νερού ανά τρίμηνο</strong>. Αυτό σημαίνει πως ακόμα και αν καταναλωθούν λιγότερα από κάποιον δημότη, θα χρεωθούν 10 κυβικά.

<br>

Να αναπτύξετε αλγόριθμο ο οποίος για έναν δημότη της Τενεούπολης:<br>

<strong>α.</strong> Θα διαβάζει το όνομά του,<br>

<strong>β.</strong> Θα διαβάζει τα κυβικά που κατανάλωσε το περασμένο τρίμηνο,<br>

<strong>γ.</strong> Θα υπολογίζει και θα εμφανίζει το ποσό του λογαριασμού του για το περασμένο τρίμηνο.

<br>

Σημειώνεται πως το <strong>μηνιαίο πάγιο</strong> για τις υπηρεσίες ύδρευσης είναι <strong>3 €</strong>.

<br>

Ο δήμος δίνει τη δυνατότητα για άτοκη εξόφληση των λογαριασμών αν το ποσό του λογαριασμού είναι μεγάλο. Πιο συγκεκριμένα:<br>

• Αν το ποσό του λογαριασμού ξεπερνά τα <strong>100 €</strong>, μπορεί να αποπληρωθεί σε <strong>2 δόσεις</strong>.<br>

• Αν το ποσό ξεπερνά τα <strong>300 €</strong>, μπορεί να αποπληρωθεί σε <strong>6 δόσεις</strong>.

<br>

<strong>δ.</strong> Ο αλγόριθμος θα πρέπει να ενημερώνει τον δημότη, εκτυπώνοντας κατάλληλα μηνύματα, σε πόσες δόσεις μπορεί να αποπληρώσει την οφειλή του στη δημοτική επιχείρηση, καθώς και το ποσό κάθε δόσης.`,
 code:['Αλγόριθμος νερο','Διάβασε κατ','Αν κατ <= 10 τότε','  χρ <- 2*10','αλλιώς_αν κατ <= 50 τότε','  χρ <- 2*κατ','αλλιώς_αν κατ <= 100 τότε','  χρ <- 50*2 + (κατ-50)*5','αλλιώς','  χρ <- 50*2 + 50*5 + (κατ-100)*9','Τέλος_αν','ποσο <- χρ + 3','Αν ποσο <= 100 τότε','  Γράψε \'Ολόκληρο το ποσό\'','αλλιώς_αν ποσο <= 300 τότε','  δοση <- ποσο / 2','  Γράψε \'Δύο δόσεις\', δοση','αλλιώς','  δοση <- ποσο / 6','  Γράψε \'Εξι δόσεις\', δοση','Τέλος_αν','Τέλος νερο'], inputs:[{id:'k',label:'κατ'}],
 run: cR(['κατ','χρ','ποσο','δοση'],(v,s)=>{s(0); s(1,{'κατ':v.k}); s(2); let xr=0; if(v.k<=10){xr=20;s(3,{'χρ':xr});}else{s(4); if(v.k<=50){xr=2*v.k;s(5,{'χρ':xr});}else{s(6); if(v.k<=100){xr=100+(v.k-50)*5;s(7,{'χρ':xr});}else{s(8); xr=350+(v.k-100)*9;s(9,{'χρ':xr});}}} s(10); let poso=xr+3;s(11,{'ποσο':poso}); s(12); if(poso<=100) s(13,null,['Ολόκληρο το ποσό']); else{s(14); if(poso<=300){let dos=poso/2;s(15,{'δοση':dos});s(16,null,['Δύο δόσεις '+fmt(dos)]);}else{s(17); let dos=poso/6;s(18,{'δοση':dos});s(19,null,['Εξι δόσεις '+fmt(dos)]);}} s(20);s(21);})},
{id:'29', cat:'Πολλαπλή Επιλογή', title:'Αθλητής άλματος',
 statement:`Ένας αθλητής του άλματος εις ύψος για να συμμετάσχει στην <strong>«Ολυμπιακή ομάδα»</strong> του 2024 πρέπει σε καθένα από τους 2 τελευταίους προκριματικούς αγώνες να έχει περάσει τα <strong>2,35 μ.</strong>

Αν και στους 2 τελευταίους προκριματικούς αγώνες έχει περάσει τα <strong>2,30 μ.</strong>, τότε περιλαμβάνεται στην <strong>«Προολυμπιακή ομάδα»</strong>, ενώ αν σε ένα τουλάχιστον ξεπέρασε τα <strong>2,30 μ.</strong>, τότε περιλαμβάνεται στην <strong>«Ομάδα επιλέκτων»</strong>.

<br>

Να γράψετε αλγόριθμο ο οποίος:<br>

<strong>α)</strong> διαβάζει το ύψος που υπερπήδησε ένας αθλητής στους 2 προκριματικούς αγώνες,<br>

<strong>β)</strong> εμφανίζει το μεγαλύτερο ύψος που πέρασε ο αθλητής,<br>

<strong>γ)</strong> εμφανίζει την ομάδα στην οποία συμπεριλαμβάνεται σύμφωνα με τα προηγούμενα.`,
 code:['Αλγόριθμος αριθμος','Διάβασε υψ1, υψ2','Αν υψ1 > υψ2 τότε','  Γράψε υψ1','αλλιώς','  Γράψε υψ2','Τέλος_αν','Αν υψ1 >= 2.35 ΚΑΙ υψ2 >= 2.35 τότε','  Γράψε \'Ολυμπιακή ομάδα\'','αλλιώς_αν υψ1 >= 2.30 ΚΑΙ υψ2 >= 2.30 τότε','  Γράψε \'Προολυμπιακή ομάδα\'','αλλιώς_αν υψ1 >= 2.30 Η υψ2 >= 2.30 τότε','  Γράψε \'Ομάδα επιλέκτων\'','αλλιώς','  Γράψε \'Καμία ομάδα\'','Τέλος_αν','Τέλος αριθμος'], inputs:[{id:'y1',label:'υψ1'},{id:'y2',label:'υψ2'}],
 run: cR(['υψ1','υψ2'],(v,s)=>{s(0); s(1,{'υψ1':v.y1,'υψ2':v.y2}); s(2); if(v.y1>v.y2) s(3,null,[fmt(v.y1)]); else{s(4);s(5,null,[fmt(v.y2)]);} s(6); s(7); if(v.y1>=2.35&&v.y2>=2.35) s(8,null,['Ολυμπιακή ομάδα']); else{s(9); if(v.y1>=2.30&&v.y2>=2.30) s(10,null,['Προολυμπιακή ομάδα']); else{s(11); if(v.y1>=2.30||v.y2>=2.30) s(12,null,['Ομάδα επιλέκτων']); else{s(13);s(14,null,['Καμία ομάδα']);}}} s(15);s(16);})},
{id:'30', cat:'Διάφορα / Συνδυαστικά', title:'Πέτρα-Ψαλίδι-Χαρτί',
 statement:`Το κλασικό παιχνίδι «Πέτρα-Ψαλίδι-Χαρτί» παίζεται με δύο παίκτες. Σε ένα γύρο του παιχνιδιού, ο κάθε παίκτης επιλέγει ένα από τα ΠΕΤΡΑ, ΨΑΛΙΔΙ, ΧΑΡΤΙ, και παρουσιάζει την επιλογή του ταυτόχρονα με τον αντίπαλό του. Η ΠΕΤΡΑ κερδίζει το ΨΑΛΙΔΙ, το ΨΑΛΙΔΙ το ΧΑΡΤΙ και το ΧΑΡΤΙ την ΠΕΤΡΑ. Σε περίπτωση που οι δύο παίκτες έχουν την ίδια επιλογή, ο γύρος λήγει ισόπαλος.

<br>

Να αναπτύξετε πρόγραμμα που να:<br>

α) διαβάζει τα ονόματα και την επιλογή των δύο παικτών σε ένα γύρο του παιχνιδιού,<br>

β) συγκρίνει τις επιλογές των παικτών και εμφανίζει το όνομα του νικητή ή, αν δεν υπάρχει νικητής, το μήνυμα «ΤΟ ΠΑΙΧΝΙΔΙ ΕΛΗΞΕ ΙΣΟΠΑΛΟ».`,
 code:['Αλγόριθμος παιχνιδι','Διάβασε ο1, ο2, επιλ1, επιλ2','ε1 <- \'ΠΕΤΡΑ\'','ε2 <- \'ΨΑΛΙΔΙ\'','ε3 <- \'ΧΑΡΤΙ\'','Αν επιλ1 = επιλ2 τότε','  Γράψε \'ΙΣΟΠΑΛΙΑ\'','αλλιώς_αν (επιλ1=ε1 ΚΑΙ επιλ2=ε2) Η (επιλ1=ε2 ΚΑΙ επιλ2=ε3) Η (επιλ1=ε3 ΚΑΙ επιλ2=ε1) τότε','  Γράψε ο1','αλλιώς','  Γράψε ο2','Τέλος_αν','Τέλος παιχνιδι'], inputs:[{id:'o1',label:'ο1',type:'text'},{id:'o2',label:'ο2',type:'text'},{id:'e1',label:'επιλ1',type:'text'},{id:'e2',label:'επιλ2',type:'text'}],
 run: cR(['ο1','ο2','επιλ1','επιλ2','ε1','ε2','ε3'],(v,s)=>{s(0); s(1,{'ο1':v.o1,'ο2':v.o2,'επιλ1':v.e1,'επιλ2':v.e2}); s(2,{'ε1':'ΠΕΤΡΑ'}); s(3,{'ε2':'ΨΑΛΙΔΙ'}); s(4,{'ε3':'ΧΑΡΤΙ'}); s(5); if(v.e1===v.e2) s(6,null,['ΙΣΟΠΑΛΙΑ']); else{s(7); if((v.e1==='ΠΕΤΡΑ'&&v.e2==='ΨΑΛΙΔΙ')||(v.e1==='ΨΑΛΙΔΙ'&&v.e2==='ΧΑΡΤΙ')||(v.e1==='ΧΑΡΤΙ'&&v.e2==='ΠΕΤΡΑ')) s(8,null,[v.o1]); else{s(9);s(10,null,[v.o2]);}} s(11);s(12);})},
{id:'31', cat:'Διάφορα / Συνδυαστικά', title:'Λύκειο - Υπολογιστές',
 statement:`Ένα Λύκειο ενδιαφέρεται ν’ αγοράσει εξοπλισμό για το εργαστήριο Πληροφορικής. Δύο καταστήματα έκαναν προσφορές σύμφωνα με τους παρακάτω πίνακες:

<table style="border-collapse:collapse;margin:0 auto;font-size:15px;min-width:720px;">

    <td style="border:1px solid #999;padding:8px 14px;text-align:center;">500 € ανά ΗΥ</td>
  </tr>

  <tr>
    <td style="border:1px solid #999;padding:8px 14px;">Από 6 και πάνω</td>
    <td style="border:1px solid #999;padding:8px 14px;text-align:center;">300 € ανά ΗΥ</td>
    <td style="border:1px solid #999;padding:8px 14px;">Από 8 και πάνω</td>

  <tr>
    <td colspan="2" style="border:1px solid #999;padding:8px 14px;text-align:center;">
      Κόστος εγκατάστασης: 400 €

    <td colspan="2" style="border:1px solid #999;padding:8px 14px;text-align:center;">
      Κόστος εγκατάστασης: 350 €

<br>

Να γράψετε αλγόριθμο ο οποίος:<br>

α) διαβάζει τον αριθμό υπολογιστών που σκοπεύει ν’ αγοράσει το Λύκειο<br>

γ) εμφανίζει το όνομα του καταστήματος με την πλέον συμφέρουσα προσφορά.`,
 code:['Αλγόριθμος λυκειο','Διάβασε πλυπ','Αν πλυπ <= 5 τότε','  χρ <- πλυπ*450','αλλιώς','  χρ <- πλυπ*300','Τέλος_αν','κοστος1 <- χρ + 400','Αν πλυπ <= 7 τότε','  χρ <- πλυπ*500','αλλιώς','  χρ <- πλυπ*200','Τέλος_αν','κοστος2 <- χρ + 350','Αν κοστος1 < κοστος2 τότε','  Γράψε \'Datamicro ΕΠΕ\'','αλλιώς_αν κοστος1 > κοστος2 τότε','  Γράψε \'Bitforce OE\'','αλλιώς','  Γράψε \'Ισες προσφορές\'','Τέλος_αν','Τέλος λυκειο'], inputs:[{id:'pl',label:'πλυπ'}],
 run: cR(['πλυπ','χρ','κοστος1','κοστος2'],(v,s)=>{s(0); s(1,{'πλυπ':v.pl}); s(2); let xr=0; if(v.pl<=5){xr=v.pl*450;s(3,{'χρ':xr});}else{s(4);xr=v.pl*300;s(5,{'χρ':xr});} s(6); let k1=xr+400;s(7,{'κοστος1':k1}); s(8); if(v.pl<=7){xr=v.pl*500;s(9,{'χρ':xr});}else{s(10);xr=v.pl*200;s(11,{'χρ':xr});} s(12); let k2=xr+350;s(13,{'κοστος2':k2}); s(14); if(k1<k2) s(15,null,['Datamicro ΕΠΕ']); else{s(16); if(k1>k2) s(17,null,['Bitforce OE']); else{s(18);s(19,null,['Ισες προσφορές']);}} s(20);s(21);})},
{id:'32', cat:'Διάφορα / Συνδυαστικά', title:'Μήνες (Ημέρες του μήνα)',
 statement:'Να γραφεί αλγόριθμος που διαβάζει έναν ακέραιο θετικό αριθμό μ (δηλ. μια τιμή από 1 ως 12) του μήνα ενός έτους, καθώς και έτος ετ και θα εμφανίζει το πλήθος days των ημερών του μήνα.',
 code:['Αλγόριθμος μηνες','Διάβασε μ, ετ','Επίλεξε μ','  περίπτωση 1,3,5,7,8,10,12','    days <- 31','  περίπτωση 4,6,9,11','    days <- 30','  περίπτωση αλλιώς','    Αν (ετ mod 4=0 ΚΑΙ ετ mod 100<>0) Ή (ετ mod 400=0) τότε','      days <- 29','    αλλιώς','      days <- 28','    Τέλος_αν','Τέλος_επιλογών','Γράψε days','Τέλος μηνες'], inputs:[{id:'m',label:'μ (1-12)'},{id:'et',label:'ετ (Έτος)'}],
 run: cR(['μ','ετ','days'],(v,s)=>{s(0); s(1,{'μ':v.m,'ετ':v.et}); s(2); let d=0; if([1,3,5,7,8,10,12].includes(v.m)){s(3); d=31; s(4,{'days':d});}else if([4,6,9,11].includes(v.m)){s(5); d=30; s(6,{'days':d});}else{s(7); s(8); if((v.et%4===0&&v.et%100!==0)||(v.et%400===0)){d=29; s(9,{'days':d});}else{s(10); d=28; s(11,{'days':d});} s(12);} s(13); s(14,null,[fmt(d)]); s(15);})},
{id:'33', cat:'Διάφορα / Συνδυαστικά', title:'Μήνες (Εποχές)',
 statement:'Να γραφεί αλγόριθμος που διαβάζει τον αύξοντα αριθμό μ (δηλ. μια τιμή από 1 ως 12) του μήνα ενός έτους και εμφανίζει την εποχή που ανήκει ο μήνας. Σε περίπτωση λάθος να εμφανίζει το μήνυμα ‘Λάθος μήνας.',
 code:['Αλγόριθμος εποχες','Διάβασε μ','Επίλεξε μ','  περίπτωση 12,1,2','    Γράψε \'ΧΕΙΜΩΝΑΣ\'','  περίπτωση 3,4,5','    Γράψε \'ΑΝΟΙΞΗ\'','  περίπτωση 6,7,8','    Γράψε \'ΚΑΛΟΚΑΙΡΙ\'','  περίπτωση 9,10,11','    Γράψε \'ΦΘΙΝΟΠΩΡΟ\'','  περίπτωση αλλιώς','    Γράψε \'ΛΑΘΟΣ ΜΗΝΑΣ\'','Τέλος_επιλογών','Τέλος εποχες'], inputs:[{id:'m',label:'μ (1-12)'}],
 run: cR(['μ'],(v,s)=>{s(0); s(1,{'μ':v.m}); s(2); if([12,1,2].includes(v.m)){s(3); s(4,null,['ΧΕΙΜΩΝΑΣ']);}else if([3,4,5].includes(v.m)){s(5); s(6,null,['ΑΝΟΙΞΗ']);}else if([6,7,8].includes(v.m)){s(7); s(8,null,['ΚΑΛΟΚΑΙΡΙ']);}else if([9,10,11].includes(v.m)){s(9); s(10,null,['ΦΘΙΝΟΠΩΡΟ']);}else{s(11); s(12,null,['ΛΑΘΟΣ ΜΗΝΑΣ']);} s(13);s(14);})},
{id:'34', cat:'Εμφωλευμένη / Πολλαπλή', title:'Άνδρας (Βάρος/Ύψος)',
 statement:'Να διαβάζονται δύο αριθμοί που αντιστοιχούν στο ύψος και βάρος ενός άνδρα. Να εκτυπώνεται ότι ο άνδρας είναι “ελαφρύς”, αν το βάρος του είναι κάτω από 80 κιλά, ή να εκτυπώνεται “βαρύς” στην αντίθετη περίπτωση. Επίσης να εκτυπώνεται “κοντός” αν το ύψος του είναι κάτω από 1.70, αλλιώς να εκτυπώνεται “ψηλός”.',
 code:['ΔΙΑΒΑΣΕ βάρος, ύψος','ΑΝ βάρος < 80 ΤΟΤΕ','  ΑΝ ύψος < 1.70 ΤΟΤΕ','    ΓΡΑΨΕ "ελαφρύς-κοντός"','  ΑΛΛΙΩΣ','    ΓΡΑΨΕ "ελαφρύς-ψηλός"','  ΤΕΛΟΣ_ΑΝ','ΑΛΛΙΩΣ','  ΑΝ ύψος < 1.70 ΤΟΤΕ','    ΓΡΑΨΕ "βαρύς-κοντός"','  ΑΛΛΙΩΣ','    ΓΡΑΨΕ "βαρύς-ψηλός"','  ΤΕΛΟΣ_ΑΝ','ΤΕΛΟΣ_ΑΝ'], inputs:[{id:'b',label:'βάρος'},{id:'y',label:'ύψος'}],

{id:'35', cat:'Εμφωλευμένη / Πολλαπλή', title:'ΔΜΣ (Αδύνατο, κανονικό...)',
 statement:`Ο Δείκτης Μάζας του ανθρώπινου Σώματος (ΔΜΣ) υπολογίζεται από το βάρος (Β) σε χλγ. και το ύψος (Υ) σε μέτρα με τον τύπο:

<br>

<div style="text-align:center;font-size:18px;font-weight:bold;">
ΔΜΣ = Β / Υ<sup>2</sup>
</div>

<br>

Ο ανωτέρω τύπος ισχύει για άτομα άνω των 18 ετών. Το άτομο ανάλογα με την τιμή του ΔΜΣ χαρακτηρίζεται σύμφωνα με τον παρακάτω πίνακα:

<br>

<table style="border-collapse:collapse;margin:0 auto;font-size:15px;min-width:500px;">
  <tr>
    <th style="border:1px solid #999;padding:8px 14px;background:#f0f0f0;">
      ΔΜΣ
    </th>
    <th style="border:1px solid #999;padding:8px 14px;background:#f0f0f0;">
      Χαρακτηρισμός
    </th>
  </tr>

  <tr>
    <td style="border:1px solid #999;padding:8px 14px;text-align:center;">
      ΔΜΣ &lt; 18,5
    </td>
    <td style="border:1px solid #999;padding:8px 14px;text-align:center;">
      "αδύνατο άτομο"
    </td>
  </tr>

  <tr>
    <td style="border:1px solid #999;padding:8px 14px;text-align:center;">
      18,5 ≤ ΔΜΣ &lt; 25
    </td>
    <td style="border:1px solid #999;padding:8px 14px;text-align:center;">
      "κανονικό άτομο"
    </td>
  </tr>

  <tr>
    <td style="border:1px solid #999;padding:8px 14px;text-align:center;">
      25 ≤ ΔΜΣ &lt; 30
    </td>
    <td style="border:1px solid #999;padding:8px 14px;text-align:center;">
      "βαρύ άτομο"
    </td>
  </tr>

  <tr>
    <td style="border:1px solid #999;padding:8px 14px;text-align:center;">
      30 ≤ ΔΜΣ
    </td>
    <td style="border:1px solid #999;padding:8px 14px;text-align:center;">
      "υπέρβαρο άτομο"
    </td>
  </tr>
</table>

<br>

Να γράψετε αλγόριθμο ο οποίος:<br>

α. να διαβάζει την ηλικία, το βάρος και το ύψος του ατόμου<br>

β. εάν η ηλικία είναι μεγαλύτερη των 18 ετών, τότε να υπολογίζει το ΔΜΣ, να ελέγχει την τιμή του ΔΜΣ από τον ανωτέρω πίνακα και να εμφανίζει τον αντίστοιχο χαρακτηρισμό<br>

γ. εάν η ηλικία είναι μικρότερη ή ίση των 18 ετών, τότε να εμφανίζει το μήνυμα "δεν ισχύει ο δείκτης ΔΜΣ".`,
 code:['Αλγόριθμος δεικτης','Διάβασε ηλ, β, υ','Αν ηλ > 18 τότε','  ΔΜΣ <- β/υ^2','  Αν ΔΜΣ < 18.5 τότε','    Γράψε \'Αδύνατο άτομο\'','  αλλιώς_αν ΔΜΣ < 25 τότε','    Γράψε \'κανονικό άτομο\'','  αλλιώς_αν ΔΜΣ < 30 τότε','    Γράψε \'βαρύ άτομο\'','  αλλιώς','    Γράψε \'υπέρβαρο άτομο\'','  Τέλος_αν','αλλιώς','  Γράψε \'Δεν ισχύει ο ΔΜΣ\'','Τέλος_αν','Τέλος δεικτης'], inputs:[{id:'il',label:'ηλ'},{id:'b',label:'β'},{id:'y',label:'υ'}],
 run: cR(['ηλ','β','υ','ΔΜΣ'],(v,s)=>{s(0); s(1,{'ηλ':v.il,'β':v.b,'υ':v.y}); s(2); if(v.il>18){let d=v.b/(v.y*v.y); s(3,{'ΔΜΣ':d}); s(4); if(d<18.5) s(5,null,['Αδύνατο άτομο']); else{s(6); if(d<25) s(7,null,['κανονικό άτομο']); else{s(8); if(d<30) s(9,null,['βαρύ άτομο']); else{s(10); s(11,null,['υπέρβαρο άτομο']);}}} s(12);}else{s(13); s(14,null,['Δεν ισχύει ο ΔΜΣ']);} s(15);s(16);})},
{id:'36', cat:'Εμφωλευμένη / Πολλαπλή', title:'ΕΛΤΑ (Επιστολές)',

Να γράψετε πρόγραμμα που:<br>

γ. Να υπολογίζει τα έξοδα αποστολής ανάλογα με τον προορισμό και το βάρος της επιστολής.<br>

δ. Να εκτυπώνει τα έξοδα αποστολής.`,
 code:['ΠΡΟΓΡΑΜΜΑ ελτα','ΔΙΑΒΑΣΕ β, πρ','ΑΝ β <= 500 ΤΟΤΕ','  ΑΝ πρ = \'ΕΣ\' ΤΟΤΕ','    χρ <- 2','  ΑΛΛΙΩΣ','    χρ <- 4.8','  ΤΕΛΟΣ_ΑΝ','ΑΛΛΙΩΣ_ΑΝ β <= 1000 τοτε','  ΑΝ πρ = \'ΕΣ\' ΤΟΤΕ','    χρ <- 3.5','  ΑΛΛΙΩΣ','    χρ <- 7.2','  ΤΕΛΟΣ_ΑΝ','ΑΛΛΙΩΣ_ΑΝ β <= 2000 ΤΟΤΕ','  ΑΝ πρ = \'ΕΣ\' ΤΟΤΕ','    χρ <- 4.6','  ΑΛΛΙΩΣ','    χρ <- 11.5','  ΤΕΛΟΣ_ΑΝ','ΤΕΛΟΣ_ΑΝ','ΓΡΑΨΕ χρ','ΤΕΛΟΣ_ΠΡΟΓΡΑΜΜΑΤΟΣ'], inputs:[{id:'b',label:'β'},{id:'p',label:'πρ (ΕΣ/ΕΞ)',type:'text'}],
 run: cR(['β','πρ','χρ'],(v,s)=>{s(0); s(1,{'β':v.b,'πρ':v.p}); s(2); let xr=0; if(v.b<=500){s(3); if(v.p==='ΕΣ'){xr=2; s(4,{'χρ':xr});}else{s(5); xr=4.8; s(6,{'χρ':xr});} s(7);}else{s(8); if(v.b<=1000){s(9); if(v.p==='ΕΣ'){xr=3.5; s(10,{'χρ':xr});}else{s(11); xr=7.2; s(12,{'χρ':xr});} s(13);}else{s(14); s(15); if(v.p==='ΕΣ'){xr=4.6; s(16,{'χρ':xr});}else{s(17); xr=11.5; s(18,{'χρ':xr});} s(19);}} s(20); s(21,null,[fmt(xr)]); s(22);})},

{id:'39', cat:'Εμφωλευμένη / Πολλαπλή', title:'Επιμορφωτικό πρόγραμμα',
 statement:`Στο πλαίσιο ενός επιμορφωτικού προγράμματος ζητούνται καθηγητές να διδάξουν μαθήματα χειρισμού υπολογιστών. Οι υποψήφιοι εκπαιδευτές γίνονται άμεσα δεκτοί στο πρόγραμμα αν είναι απόφοιτοι τμήματος Πληροφορικής Πανεπιστημίου ή ΤΕΙ. Αν κάποιος υποψήφιος εκπαιδευτής δεν έχει πτυχίο Πληροφορικής μπορεί να επιλεγεί ως εκπαιδευτής, εφόσον έχει το λιγότερο 2 έτη διδακτικής προϋπηρεσίας σε θέματα Πληροφορικής και τουλάχιστον 500 διδακτικές ώρες.

<br>

Να αναπτύξετε πρόγραμμα που θα διαβάζει αν ένας υποψήφιος είναι απόφοιτος τμήματος Πληροφορικής ("ΝΑΙ" ή "ΟΧΙ"), και αν δεν είναι θα διαβάζει τα έτη και τις ώρες διδακτικής προϋπηρεσίας και θα ελέγχει αν μπορεί να επιλεχθεί ως εκπαιδευτής.`,
 code:['Αλγόριθμος επιμορφωτης','Διάβασε αποφ','Αν αποφ = \'ΝΑΙ\' τότε','  Γράψε \'ΑΠΟΔΕΚΤΟΣ\'','αλλιώς','  Διάβασε ετη, ωρες','  Αν ετη >= 2 ΚΑΙ ωρες >= 500 τότε','    Γράψε \'ΑΠΟΔΕΚΤΟΣ\'','  αλλιώς','    Γράψε \'ΟΧΙ αποδεκτος\'','  Τέλος_αν','Τέλος_αν','Τέλος επιμορφωτης'], inputs:[{id:'a',label:'αποφ (ΝΑΙ/ΟΧΙ)',type:'text'},{id:'e',label:'ετη'},{id:'w',label:'ωρες'}],

{id:'40', cat:'Εμφωλευμένη / Πολλαπλή', title:'Rent a car (1 ή 2)',
 statement:`Ένα γραφείο ενοικιάσεως αυτοκινήτων παρέχει δύο εναλλακτικά πακέτα προσφορών στους πελάτες του.

<br>

Ι. Χρέωση 35€ για 100 χιλιόμετρα και 0,75 € για κάθε επιπλέον χιλιόμετρο<br>
ΙΙ. Χρέωση 0,35 € ανά χιλιόμετρο

<br>

Αν ο πελάτης νοικιάσει το αυτοκίνητο με ασφάλιση τότε υπάρχει επιβάρυνση 5%. Η επιβάρυνση όμως αυτή δε μπορεί να υπερβεί τα 15€.

<br>

Να αναπτύξετε αλγόριθμο που να διαβάζει το όνομα ενός πελάτη, τον τρόπο ενοικίασης που επιθυμεί (1 ή 2) και το αν επιθυμεί ασφάλιση στο αυτοκίνητό του (‘ΝΑΙ’, ‘ΟΧΙ’) και τα χιλιόμετρα που διένυσε και να εκτυπώνει την οφειλή του προς το γραφείο ενοικιάσεως.`,
 code:['Αλγόριθμος rent_a_car','Διάβασε ον, τρεν, χιλ, απ','Αν τρεν = 1 τότε','  Αν χιλ <= 100 τότε','    κοστος <- 35','  αλλιώς','    κοστος <- 35 + (χιλ-100)*0.75','  Τέλος_αν','αλλιώς','  κοστος <- 0.35 * χιλ','Τέλος_αν','Αν απ = \'ΝΑΙ\' τότε','  ασφ <- 5/100 * κοστος','  Αν ασφ > 15 τότε','    ασφ <- 15','  Τέλος_αν','αλλιώς','  ασφ <- 0','Τέλος_αν','ποσο <- κοστος + ασφ','Γράψε ον, ποσο','Τέλος rent_a_car'], inputs:[{id:'on',label:'ον',type:'text'},{id:'t',label:'τρεν (1,2)'},{id:'x',label:'χιλ'},{id:'ap',label:'απ',type:'text'}],
 run: cR(['ον','τρεν','χιλ','απ','κοστος','ασφ','ποσο'],(v,s)=>{s(0); s(1,{'ον':v.on,'τρεν':v.t,'χιλ':v.x,'απ':v.ap}); s(2); let k=0; if(v.t===1){s(3); if(v.x<=100){k=35; s(4,{'κοστος':k});}else{s(5); k=35+(v.x-100)*0.75; s(6,{'κοστος':k});} s(7);}else{s(8); k=0.35*v.x; s(9,{'κοστος':k});} s(10); s(11); let a=0; if(v.ap==='ΝΑΙ'){a=0.05*k; s(12,{'ασφ':a}); s(13); if(a>15){a=15; s(14,{'ασφ':a});} s(15);}else{s(16); a=0; s(17,{'ασφ':a});} s(18); let p=k+a; s(19,{'ποσο':p}); s(20,null,[v.on+', '+fmt(p)]); s(21);})},
{id:'41', cat:'Εμφωλευμένη / Πολλαπλή', title:'Βαθμολογητές',
 statement:`Σε κάποια εξεταστική δοκιμασία κάθε γραπτό αξιολογείται αρχικά από δύο βαθμολογητές και υπάρχει περίπτωση το γραπτό να χρειάζεται αναβαθμολόγηση από τρίτο βαθμολογητή. Στην περίπτωση αναβαθμολόγησης ο τελικός βαθμός υπολογίζεται ως εξής:

<br>

i. Αν ο βαθμός του τρίτου βαθμολογητή είναι ίσος με το μέσο όρο (Μ.Ο.) των βαθμών των δύο πρώτων βαθμολογητών, τότε ο τελικός βαθμός είναι ο Μ.Ο.<br>

ii. Αν ο βαθμός του τρίτου βαθμολογητή είναι μικρότερος από το μικρότερο βαθμό (ΜΙΝ) των δύο πρώτων βαθμολογητών, τότε ο τελικός βαθμός είναι ο ΜΙΝ.<br>

iii. Διαφορετικά, ο τελικός βαθμός είναι ο μέσος όρος του βαθμού του τρίτου βαθμολογητή με τον πλησιέστερο προς αυτόν βαθμό των δύο πρώτων βαθμολογητών.

<br>

Να αναπτύξετε αλγόριθμο υπολογισμού του τελικού βαθμού ενός γραπτού με αναβαθμολόγηση, ο οποίος:<br>

α. να διαβάζει τους βαθμούς του πρώτου, του δεύτερου και του τρίτου βαθμολογητή ενός γραπτού.<br>

β. να υπολογίζει και να εκτυπώνει το μεγαλύτερο (ΜΑΧ) και το μικρότερο (ΜΙΝ) από τους βαθμούς του πρώτου και του δεύτερου βαθμολογητή.<br>

γ. να υπολογίζει και να εκτυπώνει τον τελικό βαθμό του γραπτού σύμφωνα με την παραπάνω διαδικασία.`,
 code:['Αλγόριθμος γραπτο','Διάβασε β1, β2, β3','max <- β1','min <- β1','Αν β2 > max τότε','  max <- β2','  min <- β1','αλλιώς','  max <- β1','  min <- β2','Τέλος_αν','Εμφάνισε max, min','μο <- (β1+β2)/2','Αν β3 = μο τότε','  τβ <- μο','αλλιώς_αν β3 < min τότε','  τβ <- min','αλλιώς','  απ1 <- Α_Τ(β1-β3)','  απ2 <- Α_Τ(β2-β3)','  Αν απ1 < απ2 τότε','    τβ <- (β3+β1)/2','  αλλιώς','    τβ <- (β2+β3)/2','  Τέλος_αν','Τέλος_αν','Γράψε τβ','Τέλος γραπτο'], inputs:[{id:'b1',label:'β1'},{id:'b2',label:'β2'},{id:'b3',label:'β3'}],
 run: cR(['β1','β2','β3','max','min','μο','τβ','απ1','απ2'],(v,s)=>{s(0); s(1,{'β1':v.b1,'β2':v.b2,'β3':v.b3}); let max=v.b1; s(2,{'max':max}); let min=v.b1; s(3,{'min':min}); s(4); if(v.b2>max){max=v.b2; s(5,{'max':max}); min=v.b1; s(6,{'min':min});}else{s(7); max=v.b1; s(8,{'max':max}); min=v.b2; s(9,{'min':min});} s(10); s(11,null,[fmt(max)+', '+fmt(min)]); let mo=(v.b1+v.b2)/2; s(12,{'μο':mo}); s(13); let tb=0; if(v.b3===mo){tb=mo; s(14,{'τβ':tb});}else{s(15); if(v.b3<min){tb=min; s(16,{'τβ':tb});}else{s(17); let a1=Math.abs(v.b1-v.b3); s(18,{'απ1':a1}); let a2=Math.abs(v.b2-v.b3); s(19,{'απ2':a2}); s(20); if(a1<a2){tb=(v.b3+v.b1)/2; s(21,{'τβ':tb});}else{s(22); tb=(v.b2+v.b3)/2; s(23,{'τβ':tb});} s(24);}} s(25); s(26,null,[fmt(tb)]); s(27);})},
{id:'42', cat:'Κλιμακωτός Υπολογισμός', title:'Υπόγειο parking',
 statement:`Υπόγειο parking σε κεντρική πλατεία της Αθήνας ακολουθεί την εξής τιμολογιακή πολιτική:

Να αναπτυχθεί αλγόριθμος που θα διαβάζει τον αριθμό κυκλοφορίας του αυτοκινήτου και τις ώρες στάθμευσης και θα υπολογίζει τη χρέωση. Σημειώνεται ότι στα παραπάνω ποσά υπάρχει επιβάρυνση δημοτικού φόρου 4%.`,
 code:['Αλγόριθμος parking','Διάβασε αρκ, ωρ','Αν ωρ <= 1 τότε','  χρ <- 5','αλλιώς_αν ωρ <= 4 τότε','  χρ <- 5*1 + (ωρ-1)*2','αλλιώς_αν ωρ <= 24 τότε','  χρ <- 18','αλλιώς','  πλημ <- ωρ div 24','  υπωρες <- ωρ mod 24','  Αν υπωρες = 0 τότε','    χρ2 <- 0','  αλλιώς_αν υπωρες <= 1 τότε','    χρ2 <- 5','  αλλιώς_αν υπωρες <= 4 τότε','    χρ2 <- 5*1 + (υπωρες-1)*2','  αλλιώς','    χρ2 <- 18','  Τέλος_αν','  χρ <- πλημ*30 + χρ2','Τέλος_αν','φορ <- 4/100 * χρ','ποσο <- χρ + φορ','Γράψε \'Χρέωση:\', ποσο, \'για το αυτοκινητο:\', αρκ','Τέλος parking'], inputs:[{id:'a',label:'αρκ',type:'text'},{id:'w',label:'ωρ'}],
 run: cR(['αρκ','ωρ','χρ','πλημ','υπωρες','χρ2','φορ','ποσο'],(v,s)=>{s(0); s(1,{'αρκ':v.a,'ωρ':v.w}); s(2); let xr=0, xr2=0; if(v.w<=1){xr=5; s(3,{'χρ':xr});}else{s(4); if(v.w<=4){xr=5+(v.w-1)*2; s(5,{'χρ':xr});}else{s(6); if(v.w<=24){xr=18; s(7,{'χρ':xr});}else{s(8); let pl=Math.floor(v.w/24); s(9,{'πλημ':pl}); let yp=v.w%24; s(10,{'υπωρες':yp}); s(11); if(yp===0){xr2=0; s(12,{'χρ2':xr2});}else{s(13); if(yp<=1){xr2=5; s(14,{'χρ2':xr2});}else{s(15); if(yp<=4){xr2=5+(yp-1)*2; s(16,{'χρ2':xr2});}else{s(17); xr2=18; s(18,{'χρ2':xr2});}}} s(19); xr=pl*30+xr2; s(20,{'χρ':xr});}}} s(21); let f=0.04*xr; s(22,{'φορ':f}); let p=xr+f; s(23,{'ποσο':p}); s(24,null,['Χρέωση: '+fmt(p)+' : '+v.a]); s(25);})},
{id:'43', cat:'Εμφωλευμένη / Πολλαπλή', title:'Βαθμολογητές (Διαφορά > 12)',
 statement:`Σε κάποια εξεταστική δοκιμασία ένα γραπτό αξιολογείται από δύο βαθμολογητές στη βαθμολογική κλίμακα [0, 100].

Αν η διαφορά του α' και β' βαθμολογητή είναι μικρότερη ή ίση των 12 μονάδων ο τελικός βαθμός είναι ο μέσος όρος των δύο βαθμολογιών.

Αν η διαφορά του α' και β' βαθμολογητή είναι μεγαλύτερη των 12 μονάδων, το γραπτό δίνεται για αναβαθμολόγηση σε γ' βαθμολογητή. Ο τελικός βαθμός του γραπτού προκύπτει τότε από το μέσο όρο του γ' βαθμολογητή και του μεγαλύτερου βαθμού από τους α' και β' βαθμολογητές.

<br>

Να γράψετε αλγόριθμο ο οποίος διαβάζει τους βαθμούς των δύο βαθμολογητών, υλοποιεί την παραπάνω διαδικασία εξαγωγής τελικού βαθμού και εμφανίζει τον τελικό βαθμό του γραπτού στην εικοσαβάθμια κλίμακα.`,
 code:['Αλγόριθμος γραπτο','Διάβασε β1, β2','Αν Α_Τ(β1 - β2) > 12 τότε','  Διάβασε β3','  αθρ <- β1 + β2 + β3','  Αν β1 <= β2 ΚΑΙ β1 <= β3 τότε','    min <- β1','  αλλιώς_αν β2 < β1 ΚΑΙ β2 < β3 τότε','    min <- β2','  αλλιώς','    min <- β3','  Τέλος_αν','  τβ <- (αθρ - min) / 2','αλλιώς','  τβ <- (β1 + β2) / 2','Τέλος_αν','Γράψε τβ / 5','Τέλος γραπτο'], inputs:[{id:'b1',label:'β1'},{id:'b2',label:'β2'},{id:'b3',label:'β3'}],
 run: cR(['β1','β2','β3','αθρ','min','τβ'],(v,s)=>{s(0); s(1,{'β1':v.b1,'β2':v.b2}); s(2); let tb=0; if(Math.abs(v.b1-v.b2)>12){s(3,{'β3':v.b3||0}); let ath=v.b1+v.b2+(v.b3||0); s(4,{'αθρ':ath}); s(5); let min=0; if(v.b1<=v.b2 && v.b1<=(v.b3||0)){min=v.b1; s(6,{'min':min});}else{s(7); if(v.b2<v.b1 && v.b2<=(v.b3||0)){min=v.b2; s(8,{'min':min});}else{s(9); min=v.b3||0; s(10,{'min':min});}} s(11); tb=(ath-min)/2; s(12,{'τβ':tb});}else{s(13); tb=(v.b1+v.b2)/2; s(14,{'τβ':tb});} s(15); s(16,null,[fmt(tb/5)]); s(17);})},

{id:'46', cat:'Εμφωλευμένη / Πολλαπλή', title:'Φιλανθρωπική οργάνωση',
 statement:`Για την πραγματοποίηση μίας φιλανθρωπικής εκδήλωσης η φιλανθρωπική οργάνωση Α θέλει να ενοικιάσει μία αίθουσα αντί του ποσού των € 1000. Η φιλανθρωπική οργάνωση έχει τρεις χορηγίες.

<br>

Να γράψετε αλγόριθμο, ο οποίος:<br>

α. Να διαβάζει τα ποσά των τριών χορηγιών, να υπολογίζει και να εκτυπώνει το ποσό της μεγαλύτερης χορηγίας.<br>

β. Στη συνέχεια θα ελέγχει αν η χορηγία αυτή μπορεί να καλύψει το κόστος της ενοικίασης της αίθουσας. Αν το καλύπτει θα εκτυπώνει το μήνυμα "Μέγας Χορηγός". Αν η μεγαλύτερη χορηγία δεν μπορεί να καλύψει το κόστος ενοικίασης, θα ελέγχει αν μπορούν να το καλύψουν και οι τρεις μαζί. Αν μπορούν, θα εκτυπώνει το μήνυμα "Η ενοικίαση μπορεί να πραγματοποιηθεί", αλλιώς θα εκτυπώνει το μήνυμα "Η εκδήλωση δεν μπορεί να πραγματοποιηθεί σε αυτή την αίθουσα" και το ποσό που απαιτείται επιπλέον για να καλυφθεί το κόστος της ενοικίασης.`,
 code:['Αλγόριθμος φιλανθρωπικη','Διάβασε α, β, γ','μαχ <- α','Αν β > μαχ τότε','  μαχ <- β','Τέλος_αν','Αν γ > μαχ τότε','  μαχ <- γ','Τέλος_αν','Αν μαχ >= 1000 τότε','  Γράψε \'Μεγας Χορηγός\'','αλλιώς_αν α + β + γ >= 1000 τότε','  Γράψε \'Η εκδήλωση μπορεί να πραγματοποιηθεί\'','αλλιώς','  Γράψε \'Η εκδήλωση δεν μπορεί...\', 1000 - (α+β+γ)','Τέλος_αν','Τέλος φιλανθρωπικη'], inputs:[{id:'a',label:'α'},{id:'b',label:'β'},{id:'g',label:'γ'}],
 run: cR(['α','β','γ','μαχ'],(v,s)=>{s(0); s(1,{'α':v.a,'β':v.b,'γ':v.g}); let m=v.a; s(2,{'μαχ':m}); s(3); if(v.b>m){m=v.b; s(4,{'μαχ':m});} s(5); s(6); if(v.g>m){m=v.g; s(7,{'μαχ':m});} s(8); s(9); if(m>=1000) s(10,null,['Μεγας Χορηγός']); else{s(11); if(v.a+v.b+v.g>=1000) s(12,null,['Η εκδήλωση μπορεί να πραγματοποιηθεί']); else{s(13); s(14,null,['Δεν μπορεί: '+fmt(1000-(v.a+v.b+v.g))]);}} s(15); s(16);})},

 code:['Αλγόριθμος αριθμοι','Διάβασε α','ωρα <- α div 100','λεπτα <- α mod 100','Αν λεπτα >= 30 τότε','  λεπτα <- λεπτα - 30','  ωρα <- ωρα + 1','αλλιώς','  λεπτα <- λεπτα + 30','Τέλος_αν','β <- ωρα*100 + λεπτα','Γράψε β','Τέλος αριθμοι'], inputs:[{id:'a',label:'α (1000-2300)'}],

 code:['Αλγόριθμος αντιστροφημετρηση','Διάβασε ωρ, λεπτα, δευτ','Αν δευτ > 0 τότε','  δευτ <- δευτ - 1','αλλιώς','  δευτ <- 59','  Αν λεπτα > 0 τότε','    λεπτα <- λεπτα - 1','  αλλιώς','    λεπτα <- 59','    ωρ <- ωρ - 1','  Τέλος_αν','Τέλος_αν','Γράψε ωρ, λεπτα, δευτ','Τέλος αντιστροφημετρηση'], inputs:[{id:'w',label:'ωρ'},{id:'l',label:'λεπτα'},{id:'d',label:'δευτ'}],
 run: cR(['ωρ','λεπτα','δευτ'],(v,s)=>{s(0); s(1,{'ωρ':v.w,'λεπτα':v.l,'δευτ':v.d}); s(2); if(v.d>0){v.d--; s(3,{'δευτ':v.d});}else{s(4); v.d=59; s(5,{'δευτ':v.d}); s(6); if(v.l>0){v.l--; s(7,{'λεπτα':v.l});}else{s(8); v.l=59; s(9,{'λεπτα':v.l}); v.w--; s(10,{'ωρ':v.w});} s(11);} s(12); s(13,null,[fmt(v.w)+', '+fmt(v.l)+', '+fmt(v.d)]); s(14);})},

 code:['Αλγόριθμος τηλεφωνο','Διάβασε δευτ','λεπτα <- δευτ div 60','υπ <- δευτ mod 60','Αν υπ <> 0 τότε','  λεπτα <- λεπτα + 1','Τέλος_αν','Αν λεπτα <= 3 τότε','  χρ <- λεπτα * 0.06','αλλιώς','  χρ <- 3*0.06 + (λεπτα-3)*0.04','Τέλος_αν','Γράψε χρ','Τέλος τηλεφωνο'], inputs:[{id:'d',label:'δευτ'}],
 run: cR(['δευτ','λεπτα','υπ','χρ'],(v,s)=>{s(0); s(1,{'δευτ':v.d}); let l=Math.floor(v.d/60); s(2,{'λεπτα':l}); let yp=v.d%60; s(3,{'υπ':yp}); s(4); if(yp!==0){l++; s(5,{'λεπτα':l});} s(6); s(7); let xr=0; if(l<=3){xr=l*0.06; s(8,{'χρ':xr});}else{s(9); xr=3*0.06+(l-3)*0.04; s(10,{'χρ':xr});} s(11); s(12,null,[fmt(xr)]); s(13);})},

const list = document.getElementById('exList');
const done = new Set();
const States = {};

EXERCISES.forEach((ex, i)=>{
  const card = document.createElement('article');
  card.className = 'ex-card'; card.dataset.cat = ex.cat; card.id = 'ex-'+ex.id;
  const inHtml = ex.inputs.map(f=>`<div class="field"><label>${f.label}</label><input type="${f.type||'number'}" id="in-${ex.id}-${f.id}" data-key="${f.id}" data-type="${f.type||'number'}" placeholder="${f.type==='text'?'π.χ. ΝΑΙ':'0'}"></div>`).join('');
  card.innerHTML = `<div class="ex-head"><span class="ex-badge">Άσκηση ${String(i+1).padStart(2,'0')}</span><span class="ex-cat">${ex.cat}</span><h3>${ex.title}</h3></div><div class="ex-statement">${ex.statement}</div><div class="ex-actions"><button class="btn btn-solution" onclick="this.classList.toggle('open');document.getElementById('wrap-sol-${ex.id}').classList.toggle('open')">👁 Αλγόριθμος</button><button class="btn btn-try" onclick="this.classList.toggle('open');document.getElementById('wrap-try-${ex.id}').classList.toggle('open')">▶ Δοκίμασέ το</button></div><div class="collapse" id="wrap-sol-${ex.id}"><div class="collapse-inner">${rC(ex.code, ex.id+'_sol')}</div></div><div class="collapse" id="wrap-try-${ex.id}"><div class="collapse-inner"><div class="try-panel"><div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:15px;"><div class="inputs-grid">${inHtml}</div><div style="display:flex;gap:10px;align-items:flex-end;"><button class="btn btn-run btn-auto" id="btn-auto-${ex.id}">Αυτόματα ▶</button><button class="btn btn-solution btn-step" id="btn-step-${ex.id}" style="border:1px solid var(--indigo);">Βήμα-Βήμα ⏯</button></div></div><div class="execution-area" id="exec-area-${ex.id}" style="display:none;"><div class="exec-layout"><div class="exec-code">${rC(ex.code, ex.id)}</div><div class="exec-trace"><div class="table-responsive"><table class="trace-table" id="table-${ex.id}"><thead><tr id="thead-${ex.id}"></tr></thead><tbody id="tbody-${ex.id}"></tbody></table></div><div class="console-out"><div class="console-out-title">Οθονη (Γραψε)</div><div id="console-lines-${ex.id}"></div></div><button class="btn btn-next" id="btn-next-${ex.id}" style="display:none;">Επόμενο Βήμα ⏭</button></div></div></div></div><p class="hint">Συμπλήρωσε τα πεδία και πάτα «Αυτόματα» ή «Βήμα-Βήμα».</p></div></div>`;
  list.appendChild(card);
});

document.querySelectorAll('.btn-auto').forEach(b => b.onclick=()=>start(b.id.replace('btn-auto-',''),true));
document.querySelectorAll('.btn-step').forEach(b => b.onclick=()=>start(b.id.replace('btn-step-',''),false));
document.querySelectorAll('.btn-next').forEach(b => b.onclick=()=>doS(b.id.replace('btn-next-','')));

function start(id, auto) {
  const ex=EXERCISES.find(e=>e.id===id); let ok=true; const v={};
  document.querySelectorAll(`#ex-${id} .try-panel input`).forEach(el=>{
    if(el.dataset.type==='text'){let vl=el.value.trim().toUpperCase();if(!vl){ok=false;el.classList.add('err');}else{el.classList.remove('err');v[el.dataset.key]=vl;}}
    else{let vl=parseFloat(el.value.replace(',','.'));if(isNaN(vl)){ok=false;el.classList.add('err');}else{el.classList.remove('err');v[el.dataset.key]=vl;}}
  });
  if(!ok) return;
  if(States[id]&&States[id].t) clearInterval(States[id].t);
  const r=ex.run(v);
  document.getElementById(`exec-area-${id}`).style.display='block';
  document.getElementById(`console-lines-${id}`).innerHTML='';
  document.getElementById(`tbody-${id}`).innerHTML='';
  document.getElementById(`thead-${id}`).innerHTML=`<th>Γραμμή</th>`+r.varNames.map(nm=>`<th>${nm}</th>`).join('');
  document.querySelectorAll(`#code-${id} .code-line`).forEach(l=>l.classList.remove('active'));
  States[id]={tr:r.trace, i:0, vN:r.varNames, lst:{}};
  if(auto){document.getElementById(`btn-next-${id}`).style.display='none';States[id].t=setInterval(()=>doS(id),1200);doS(id);}
  else{document.getElementById(`btn-next-${id}`).style.display='flex';doS(id);}
  done.add(id); document.getElementById('ex-'+id).classList.add('done');
  document.getElementById('trailFill').style.width=Math.round((done.size/51)*100)+'%';
  document.getElementById('trailCaption').textContent=`${done.size} από 51 ασκήσεις διερευνήθηκαν`;
}
function doS(id) {
  const st=States[id]; if(!st) return;
  if(st.i>=st.tr.length){if(st.t)clearInterval(st.t);document.getElementById(`btn-next-${id}`).style.display='none';document.querySelectorAll(`#code-${id} .code-line`).forEach(l=>l.classList.remove('active'));return;}
  const sd=st.tr[st.i];
  document.querySelectorAll(`#code-${id} .code-line`).forEach(l=>l.classList.remove('active'));
  const el=document.getElementById(`line-${id}-${sd.line}`); if(el) el.classList.add('active');
  const tb=document.getElementById(`tbody-${id}`), tr=document.createElement('tr');
  tr.innerHTML=`<td style="color:var(--ink-soft);">${sd.line+1}</td>`+st.vN.map(nm=>{let vl=sd.vars[nm];let h='';if(vl!==undefined){if(st.lst[nm]!==vl)h=' class="changed"';return `<td${h}>${fmt(vl)}</td>`;}return `<td></td>`;}).join('');
  tb.appendChild(tr); st.lst={...sd.vars};
  if(sd.pr){const co=document.getElementById(`console-lines-${id}`);sd.pr.forEach(p=>{const d=document.createElement('div');d.textContent='> '+p;co.appendChild(d);});co.parentElement.scrollTop=co.parentElement.scrollHeight;}
  tb.parentElement.scrollTop=tb.parentElement.scrollHeight; st.i++;
}

const fEl = document.getElementById('filters');
[['all','Όλες'],['Απλή Επιλογή','Απλή'],['Σύνθετη Επιλογή','Σύνθετη'],['Πολλαπλή Επιλογή','Εμφωλευμένη/Πολλαπλή'],['Κλιμακωτός Υπολογισμός','Κλιμακωτή'],['Διάφορα / Συνδυαστικά','Διάφορα']].forEach((c,i)=>{
  const cp=document.createElement('button'); cp.className='chip'+(i===0?' active':''); cp.textContent=c[1];
  cp.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));cp.classList.add('active');document.querySelectorAll('.ex-card').forEach(cd=>{cd.style.display=(c[0]==='all'||cd.dataset.cat===c[0])?'':'none';});};
  fEl.appendChild(cp);
});
